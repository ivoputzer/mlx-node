name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-publish:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff the package.json for version changes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Resolve Swift Dependencies
        run: swift package resolve

      - name: Cache default.metallib
        id: cache-metallib
        uses: actions/cache@v4
        with:
          path: |
            bridges/swift/default.metallib
          key: ${{ runner.os }}-metallib-${{ hashFiles('bridges/swift/Package.resolved') }}

      - name: Install Node Dependencies
        run: npm ci

      # We just run the build script!
      # It will automatically detect if the cache hit
      # If files will exist and skip xcodebuild, or it will run xcodebuild if needed.
      - name: Build Swift N-API Bridge
        working-directory: bridges/swift
        run: ./build.sh

      # Upload the final Node Addon and Metallib as CI artifacts so you can download them
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: default.metallib
          path: |
            bridges/swift/mlx.node
            bridges/swift/default.metallib
