name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    outputs:
      napi-key: ${{ steps.napi.outputs.cache-primary-key }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        id: swift
        with:
          path: bridges/swift/.build
          key: swift-cache-${{ runner.os }}-${{ hashFiles('bridges/swift/Package.resolved') }}
          restore-keys: swift-cache-${{ runner.os }}-

      - run: swift package resolve --disable-automatic-resolution
        working-directory: bridges/swift
        if: steps.swift.outputs.cache-hit != 'true'

      - run: npm run build:metal
        working-directory: bridges/swift
        if: steps.swift.outputs.cache-hit != 'true'

      - uses: actions/cache/restore@v5
        id: napi
        with:
          path: |
            bridges/swift/mlx.node
            bridges/swift/default.metallib
          key: napi-cache-${{ runner.os }}-${{ hashFiles('bridges/swift/Package.*', 'bridges/swift/Sources/**/*.swift', 'bridges/swift/*.c', 'bridges/swift/*.h') }}
          lookup-only: true

      - run: cp $(npm run -s build:metal:product) default.metallib
        working-directory: bridges/swift
        if: steps.napi.outputs.cache-hit != 'true'

      - run: npm run build:swift -- --configuration release --disable-automatic-resolution
        working-directory: bridges/swift
        if: steps.napi.outputs.cache-hit != 'true'

      - uses: actions/setup-node@v6
        if: steps.napi.outputs.cache-hit != 'true'
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - run: npm run build:napi
        working-directory: bridges/swift
        if: steps.napi.outputs.cache-hit != 'true'

      - uses: actions/cache/save@v5
        if: steps.napi.outputs.cache-hit != 'true'
        with:
          path: |
            bridges/swift/mlx.node
            bridges/swift/default.metallib
          key: ${{ steps.napi.outputs.cache-primary-key }}

      - run: npm run test:swift -- --configuration release --disable-automatic-resolution
        working-directory: bridges/swift

  test-lint-deploy:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # required to diff the package.json for version changes

      - uses: actions/cache/restore@v5
        with:
          key: ${{ needs.build.outputs.napi-key }}
          fail-on-cache-miss: true
          path: |
            bridges/swift/mlx.node
            bridges/swift/default.metallib

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm test --workspaces --if-present

      - name: gh release upload edge bridges/swift/default.metallib bridges/swift/mlx.node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f edge
          git push -f origin edge
          if ! gh release view edge >/dev/null 2>&1; then
            gh release create edge --prerelease --title "🚧 Continuous Build (Edge)" --notes "Bleeding-edge pre-compiled macOS binaries for Apple Silicon. Auto-updated on every push to main."
          fi
          gh release upload edge bridges/swift/default.metallib bridges/swift/mlx.node --clobber
