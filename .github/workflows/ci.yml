name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff the package.json for version changes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # - name: Select Xcode 16.2 (Swift 6.1+)
      #   run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache default.metallib
        id: cache-metallib
        uses: actions/cache@v4
        with:
          path: |
            bridges/swift/default.metallib
          key: ${{ runner.os }}-metallib-${{ hashFiles('bridges/swift/Package.resolved') }}

      - name: Cache swift & xcodebuild
        uses: actions/cache@v4
        with:
          path: |
            bridges/swift/.build
            bridges/swift/.swiftpm
          key: ${{ runner.os }}-swift-build-${{ hashFiles('bridges/swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-

      # - name: Cache metadata
