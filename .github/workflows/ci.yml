name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    outputs:
      metal-key: ${{ steps.metal.outputs.cache-primary-key }}
      n-api-key: ${{ steps.n-api.outputs.cache-primary-key }}

    steps:
      - uses: actions/checkout@v6

      # FETCH SWIFT PACKAGES (ONLY WHEN NECESSARY: Changes in bridges/swift/Package.resolved)
      #
      - uses: actions/cache@v5
        id: spm
        with:
          path: bridges/swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('bridges/swift/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - if: steps.spm.outputs.cache-hit != 'true'
        run: swift package resolve --disable-automatic-resolution
        working-directory: bridges/swift

      # BUILD METAL (ONLY WHEN NECESSARY: Changes in bridges/swift/.build/checkouts/mlx-swift/**)
      #
      - uses: actions/cache/restore@v5
        id: metal
        with:
          path: bridges/swift/default.metallib
          key: ${{ runner.os }}-metal-${{ hashFiles('bridges/swift/Package.resolved') }}
          lookup-only: true

      - if: steps.metal.outputs.cache-hit != 'true'
        run: npm run build:metal
        working-directory: bridges/swift

      - uses: actions/cache/save@v5
        if: steps.metal.outputs.cache-hit != 'true'
        with:
          path: bridges/swift/default.metallib
          key: ${{ steps.metal.outputs.cache-primary-key }}

      # BUILD N-API (ONLY WHEN NECESSARY: Changes in bridges/swift/**/*.c, bridges/swift/**/*.h, bridges/swift/**/*.swift, bridges/swift/Package.*)
      #
      - uses: actions/cache/restore@v5
        id: n-api
        with:
          path: bridges/swift/mlx.node
          key: ${{ runner.os }}-n-api-${{ hashFiles('bridges/swift/**/*.c', 'bridges/swift/**/*.h', 'bridges/swift/**/*.swift', 'bridges/swift/Package.*') }}
          lookup-only: true

      - if: steps.n-api.outputs.cache-hit != 'true'
        working-directory: bridges/swift
        run: npm run build:swift -- --disable-automatic-resolution

      - if: steps.n-api.outputs.cache-hit != 'true'
        working-directory: bridges/swift
        run: npm run test:swift -- --disable-automatic-resolution

      - if: steps.n-api.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - if: steps.n-api.outputs.cache-hit != 'true'
        working-directory: bridges/swift
        run: npm run build:clang

      - if: steps.n-api.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: bridges/swift/mlx.node
          key: ${{ steps.n-api.outputs.cache-primary-key }}

  test-lint-deploy:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # required to diff the package.json for version changes

      # RESTORE METAL & N-API FROM CACHE (Hydrates: bridges/swift/default.metallib, bridges/swift/mlx.node)
      #
      - uses: actions/cache/restore@v5
        with:
          key: ${{ needs.build.outputs.metal-key }}
          fail-on-cache-miss: true
          path: bridges/swift/default.metallib

      - uses: actions/cache/restore@v5
        with:
          key: ${{ needs.build.outputs.n-api-key }}
          fail-on-cache-miss: true
          path: bridges/swift/mlx.node

      - uses: actions/upload-artifact@v7
        with:
          name: default.metallib
          archive: true
          if-no-files-found: error
          path: bridges/swift/default.metallib
          overwrite: true

      - uses: actions/upload-artifact@v7
        with:
          name: mlx.node
          archive: true
          if-no-files-found: error
          path: bridges/swift/mlx.node
          overwrite: true

      # REGULAR NPM WORKSPACE PIPLINE FROM NOW ON...
      #
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm test --workspaces --if-present

      # - name: requires release
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   id: version
      #   shell: bash
      #   run: |
      #     NEW_VERSION=$(jq -r .version package.json)
      #     OLD_VERSION=$(git show ${{ github.event.before }}:package.json | jq -r .version || echo "0.0.0")
      #     if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
      #       echo "changed=true" >> $GITHUB_OUTPUT
      #       echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
      #       echo "🚀 Version bumped from $OLD_VERSION to $NEW_VERSION"
      #     else
      #       echo "changed=false" >> $GITHUB_OUTPUT
      #       echo "💤 No version bump detected."
      #     fi

      # - name: npm publish
      #   if: steps.version.outputs.changed == 'true'
      #   run: |
      #     # node scripts/sync-versions.js
      #     # npm publish --workspaces --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

