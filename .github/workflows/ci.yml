      #   run: npm run download

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Workspaces
        run: npm run build --workspaces --if-present

      - name: Lint Workspaces
        run: npm run lint

      - name: Test Workspaces
        run: npm test --workspaces --if-present

